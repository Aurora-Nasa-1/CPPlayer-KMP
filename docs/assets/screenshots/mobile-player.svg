<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2050"/>
      <stop offset="0.55" stop-color="#17172E"/>
      <stop offset="1" stop-color="#0F1424"/>
    </linearGradient>
    <linearGradient id="mbrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A7BF5"/>
      <stop offset="1" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="mcover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A44F"/>
      <stop offset="0.5" stop-color="#D94F8A"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7C6BF2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C6BF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="760" rx="28" fill="url(#mbg)"/>
  <ellipse cx="180" cy="300" rx="240" ry="260" fill="url(#mglow)"/>

  <!-- status bar -->
  <text x="28" y="34" fill="#CFC9E8" font-size="12" font-weight="600">9:41</text>
  <rect x="286" y="24" width="22" height="11" rx="3" fill="none" stroke="#CFC9E8" stroke-width="1.5"/>
  <rect x="289" y="27" width="13" height="5" rx="1" fill="#CFC9E8"/>
  <rect x="314" y="24" width="18" height="11" rx="3" fill="#CFC9E8"/>
  <path d="M338 30 a6 6 0 0 0 -12 0" fill="none" stroke="#CFC9E8" stroke-width="1.5"/>

  <!-- header -->
  <path d="M30 68 l-10 -10 l10 -10" fill="none" stroke="#D6D0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="72" fill="#F2EFFB" font-size="14" font-weight="600" text-anchor="middle">正在播放</text>
  <text x="334" y="72" fill="#D6D0EC" font-size="18" text-anchor="middle">···</text>

  <!-- cover -->
  <rect x="48" y="112" width="264" height="264" rx="18" fill="url(#mcover)"/>
  <circle cx="180" cy="244" r="72" fill="#fff" fill-opacity="0.10"/>
  <circle cx="180" cy="244" r="46" fill="#fff" fill-opacity="0.12"/>
  <circle cx="180" cy="244" r="13" fill="#fff" fill-opacity="0.4"/>
  <path d="M174 228 L200 244 L174 260 Z" fill="#fff" fill-opacity="0.9"/>

  <!-- title -->
  <text x="48" y="424" fill="#FFFFFF" font-size="24" font-weight="800">夜航星</text>
  <text x="48" y="452" fill="#B9B2D8" font-size="14">Aurora · 深空漫游</text>
  <path d="M48 476 l10 -6 l10 6 l-10 6 Z M76 476 l10 -6 l10 6 l-10 6 Z" fill="#C9B8FF"/>

  <!-- progress -->
  <rect x="48" y="500" width="264" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.14"/>
  <rect x="48" y="500" width="106" height="4" rx="2" fill="url(#mbrand)"/>
  <circle cx="154" cy="502" r="6" fill="#D6C8FF"/>
  <text x="48" y="524" fill="#8E88AD" font-size="11">01:24</text>
  <text x="312" y="524" fill="#8E88AD" font-size="11" text-anchor="end">04:16</text>

  <!-- controls -->
  <g fill="#EDEAFB">
    <path d="M118 568 l12 -8 v16 Z"/><path d="M142 568 l12 -8 v16 Z"/>
  </g>
  <circle cx="180" cy="568" r="26" fill="url(#mbrand)"/>
  <path d="M173 557 L193 568 L173 579 Z" fill="#fff"/>
  <g fill="#EDEAFB">
    <path d="M206 568 l12 -8 v16 Z"/><path d="M230 568 l12 -8 v16 Z"/>
  </g>
  <text x="60" y="573" fill="#9A94B8" font-size="15" font-weight="700">循环</text>
  <text x="300" y="573" fill="#9A94B8" font-size="15" font-weight="700">倍速</text>

  <!-- lyric preview -->
  <rect x="48" y="614" width="264" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="64" y="642" fill="#FFFFFF" font-size="15" font-weight="700">我在夜色里航行</text>
  <text x="64" y="668" fill="#7E78A4" font-size="13">向着星光的方向</text>

  <!-- bottom nav -->
  <line x1="0" y1="706" x2="360" y2="706" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g fill="#9A94B8" font-size="11" text-anchor="middle">
    <text x="54" y="736">发现</text>
    <text x="138" y="736">搜索</text>
    <text x="222" y="736" fill="#C9B8FF" font-weight="700">播放</text>
    <text x="306" y="736">我的</text>
  </g>
  <circle cx="222" cy="718" r="3" fill="#C9B8FF"/>

  <!-- placeholder tag -->
  <rect x="96" y="86" width="168" height="24" rx="12" fill="#0E0E17" fill-opacity="0.5" stroke="#45405F"/>
  <text x="180" y="102" fill="#D6D0EC" font-size="11" text-anchor="middle">界面示意 · 待替换</text>
</svg>
