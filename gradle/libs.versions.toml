[versions]
agp = "9.1.1"
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.7.3"
ktor = "3.6.0"
datetime = "0.6.1"
# 1.12.1 = 当前 stable 线最新。这一行同时**决定 skiko 版本**（1.11.1→0.144.6，1.12.1→0.150.1），
# 而 skiko 又是 Coil 选型的分水岭（见下面 coil 的注释）：两边一致时 compose 插件才不会报
# "Skiko dependencies' versions are incompatible"。
compose = "1.12.1"
# 2.2.21-1.10.3 是「Kotlin 2.2.21 + Compose 1.10.3」的兼容性标记，不是语义版本。
# 升它之前担心的「跨大版本破坏」经 javap 逐类核对**不成立**：61 个公共类一个没删，
# 全部差异只是接口默认实现的 JVM 呈现方式变了 —— 旧的 `-Xjvm-default=disable`
# （`Screen$DefaultImpls` 承载默认实现）换成了 `all`（真 default 方法 + `access$…$jd` 桥接）。
# 字节码等价，尤其 `Screen.getKey()` 前后都在调同一个 `ScreenKt.commonKeyGeneration`，
# 所以「同类 Screen 共享 ScreenModel」那条结论不受影响（见 MEMORY「关键坑」）。
voyager = "2.2.21-1.10.3"
androidx-activity = "1.9.3"
qrose = "1.3.0"
# 1.11.1：从 1.4.1 跨了 7 个 minor，但逐类 javap 核对后**项目用到的 API 全部保留** ——
# `COMMAND_SEEK_*` 13 个常量一字未变、`onUpdateNotification(MediaSession, boolean)` 签名相同、
# `addSession` / `removeSession` / `SERVICE_INTERFACE` / `DefaultMediaNotificationProvider.setSmallIcon`
# 都在；ExoPlayer / datasource / cache / database 那批**只有新增、没有删除**（删掉的
# `legacy.*` / `video.CompositingVideoSinkProvider` / `AudioFocusManager` 等本仓都没用）。
# ⚠️ 唯一的**结构性变化**：`MediaSessionService` 的基类由 `android.app.Service` 变成
# `androidx.lifecycle.LifecycleService`（media3-session 的 POM 已带 `lifecycle-service:2.8.0`，
# 会自动传递引入，不必显式声明）。
# 💡 1.11.x 新增了 `setShowNotificationForIdlePlayer(...)` 与 `setForegroundServiceTimeoutMs(...)`
# —— 前者正对应「启动时时间线为空 ⇒ 恒不显示通知」那条旧结论，将来可用它取代现在对
# media3 内部行为的依赖（见 PlaybackMediaSessionService 的长注释）。
media3 = "1.11.1"
# 锁 3.6.3，与 compose 1.12.1 严格对齐：coil-compose-core 要求 compose foundation 1.12.0，
# 它声明的 skiko 0.150.1 正好等于 compose 1.12.1 的 skiko ⇒ 不再触发兼容性警告。
# ⚠️ 这一行与 compose 是**联动**的，别单独动：
#   compose 1.11.1 ↔ coil 3.5.0（skiko 0.144.6）
#   compose 1.12.x  ↔ coil 3.6.x（skiko 0.150.1）
# 3.3.0（skiko 0.9.4.2）/ 3.4.0（skiko 0.9.22.2）都落在两档之外，必然报警。
coil = "3.6.3"
# 播放页的流体背景（仿 Apple Music 的流动网格渐变）：把 SkSL 运行时着色器包成
# Compose Multiplatform 的 `Modifier.shaderBackground`。
#
# ⚠️ **版本与 Kotlin / CMP 是联动的**，不能单独升：0.6.0 的 Gradle module metadata 里
# 写死 `kotlin-stdlib 2.4.10` + `compose.ui / compose.foundation 1.12.0`，
# 与本项目的 `kotlin = 2.4.10` / `compose = 1.12.1` 正好同代（本项目更高，安全）。
# 换版本前先读它的 `.module` 文件核对这两项。
#
# ⚠️ **只引 `hypnoticcanvas`，不要引 `hypnoticcanvas-shaders`**：后者除
# PrismGlass / SpectralAurora 外，其余着色器是 `CC-BY-NC-SA-3.0`（**非商用**）。
# 本项目要用的 `MeshGradient` 在 core 模块里，是 MIT。
#
# ⚠️ 各平台能力不同（库自身行为，不是 bug）：桌面 / iOS / Web 恒走真着色器；
# Android 只有 **API 33+** 有 `android.graphics.RuntimeShader`，更低版本自动回退到
# 调用方给的 `fallback` Brush（见 `CpFluidBackground` 的 KDoc）。
hypnoticcanvas = "0.6.0"
# Mozilla Rhino：纯 JVM 的 JavaScript 引擎，用于运行 Lyrico 格式的歌词源插件。
# 选它而不是 Android 专有的 QuickJS wrapper 是因为本仓库要 Android 与桌面
# **共用同一套宿主契约**，而 QuickJS 的 Android wrapper 在桌面 JVM 上不可用。
# Rhino 支持插件实际用到的 ES5/ES2020 子集（globalThis / JSON / RegExp / Array 高阶函数）。
# ⚠️ 版本需 ≥ 1.7.13 才有 globalThis；锁 1.7.15（1.7.x 线最后一个稳定版）。
rhino = "1.7.15"
# —— 歌词对外投放（系统级歌词渠道）——
# 这四个都是 AAR，且**只在 androidMain 用**：桌面端没有对应生态，commonMain 只留
# 「纯协议层」（OPlus 的 LRC/JSON 构建、节流与重试策略），才能在 desktopTest 里单测。
#
# ⚠️ 词幕 provider 与 HyperOS focus-api 都在 Maven Central；SuperLyricApi 与
# Lyric-Getter-Api **只在 JitPack**（settings.gradle.kts 的 jitpack 仓库就是为它们加的）。
lyriconProvider = "0.1.70"
superLyricApi = "3.4"
lyricGetterApi = "7.0.0"
hyperFocusApi = "1.4"
mp3spi = "1.9.5.4"
jflac = "1.5.2"
jlayer = "1.0.1"
jmtc = "0.0.3"
# jna-platform 用于 SMTC 应用身份注册（AUMID / 开始菜单快捷方式），版本对齐 JMTC 传递的 jna。
jna = "5.19.1"
accompanist-lyrics-ui = "1.0.19"
accompanist-lyrics-core = "0.4.7"
# ⚠️ material-kolor 必须与上面的 compose 行保持一致：5.0.0 依赖 compose 1.11.1，
# 5.0.1 依赖 compose 1.12.0 + material3 1.12.0-alpha03。一旦错配，它会把整个项目的
# Compose 运行时顶上去而 **compose 插件版本不会跟着变** ⇒ 编译期与运行期版本不一致。
# 注意：5.x 的 android 产物要求 compileSdk ≥ 37（AGP 9.2.1 构建），三处 android DSL 的
# compileSdk 已同步提到 37（见 app / core / app-android 的 build.gradle.kts）。
materialkolor = "5.0.1"
# 取色算法用 Material You 官方的 material-color-utilities（QuantizerCelebi + Score），
# 与 Android 的 Monet 同源。换成别的量化器（例如 androidx.palette 的 Vibrant 偏好）
# 取出来的主色**会和系统 / 其他 MD3 应用不一致** —— Win11 默认壁纸上表现为取到花的玫红
# 而不是大面积底色蓝。它本是 material-kolor 的传递依赖，这里显式声明：
# 直接调它的 API 就不该依赖别人的依赖图。
material-color-utilities = "5.0.1"
# ⚠️ material3 的版本**不由 compose 插件决定**：插件把 `compose.material3` 钉在 1.9.0
# （见 compose-gradle-plugin 里的 ComposeBuildConfig），而 1.9.0 缺少 M3 Expressive 的
# 标志性 API —— `MaterialShapes` / `WavyProgressIndicator` / `LoadingIndicator` /
# `ToggleButton` / `ButtonGroup` / `FloatingToolbar` / `SplitButton` 全都不在。
# 这里显式声明 1.12.0-alpha03 把它顶上去。注意**这条线只有 alpha、没有 stable**
# （1.12.0 从未发正式版，再往上就是 1.13.0-alpha01）——要用 Expressive API 就只能吃实验版。
# 方向是安全的：
#   - 它依赖 compose `1.12.0-beta01` < 本项目的 `1.12.1`（拿到的比它编译时的更新）；
#   - 它依赖 `androidx.graphics:graphics-shapes`（形状变形的底层实现）；
#   - 与 `material-kolor` 5.0.1 的编译目标**完全一致**（5.0.1 自己就依赖这个精确版本）。
# 换版本后必须复核 material-kolor 的字节码兼容性（见 TOPICS.md「主题 / 取色」）。
material3 = "1.12.0-alpha03"
# 核心库脱糖（core library desugaring）：把 `java.time` / `java.util.stream` /
# `java.util.function` / `java.util.Optional` 这些 **Java 8+ 才有的 JDK API**
# 打包进 APK，让 minSdk 24（Android 7.0）也能跑。
#
# ⚠️ 必须用 **`_nio` 变体**，不是 `desugar_jdk_libs`：
# `core/src/jvmMain/.../PlatformSupport.kt` 的 `moveFile()` / `moveDir()` 用了
# `java.nio.file.Files`（API 26+），而**标准变体不覆盖 `java.nio.file`**。
# 已验证 `moveFile` 是安卓可达路径（`DownloadEngine` / `DownloadTaskStore` 都调它）
# ⇒ 用标准变体的话，API 24/25 上「下载完成落盘」那一步会 NoClassDefFoundError。
# 两个变体的 `desugar.json` 已逐项对比：`_nio` = 标准 + `java.nio.file*`，是超集。
#
# ⚠️ 只有 `java.time` 是硬需求：`PlatformSupport.kt` 的 `localDateTimeOf()` 与
# `app` 的待机设置页都直接调 `java.time.Instant/ZoneId`，而 `java.time` 从 **API 26**
# 才进系统。minSdk 29 时不需要，降到 24 就必须开。
# 不开的后果不是编译失败 —— 是**运行时** `NoClassDefFoundError`（被 runCatching
# 包住时还会静默退化成空串，正是 AGENTS.md §5 记的那类坑）。
#
# 2.1.5 = 2.1.x 线最新（Google Maven 上的最后一个版本，2025-02 之后没再发）。
desugar-jdk-libs = "2.1.5"

[libraries]
accompanist-lyrics-ui = { module = "com.mocharealm.accompanist:lyrics-ui", version.ref = "accompanist-lyrics-ui" }
accompanist-lyrics-core = { module = "com.mocharealm.accompanist:lyrics-core", version.ref = "accompanist-lyrics-core" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar-jdk-libs" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
# compose 插件 1.11.x 起 `compose.components.resources` 访问器已标 deprecated
# （编译时警告 "'val resources: String' is deprecated. Specify dependency directly."），
# 显式按坐标声明，版本与插件一致。
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }
voyager-koin = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
androidx-media-compat = { module = "androidx.media:media", version = "1.7.0" }
composemediaplayer-audio = { module = "io.github.kdroidfilter:composemediaplayer-audio", version = "0.11.4" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
hypnoticcanvas = { module = "com.mikepenz.hypnoticcanvas:hypnoticcanvas", version.ref = "hypnoticcanvas" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
# 词幕（Lyricon）：Provider API —— 词幕侧靠 manifest 的 lyricon_module 元数据发现本应用。
lyricon-provider = { module = "io.github.proify.lyricon:provider", version.ref = "lyriconProvider" }
# SuperLyric：HChenX 的广播 IPC 生态，逐字歌词发布者协议。
superlyric-api = { module = "com.github.HChenX:SuperLyricApi", version.ref = "superLyricApi" }
# Lyric Getter：cn.lyric.getter.api 生态（状态栏歌词老牌方案）。
lyric-getter-api = { module = "com.github.HChenX:Lyric-Getter-Api", version.ref = "lyricGetterApi" }
# HyperOS 超级小岛：Focus Notification 的 Kotlin DSL（miui.focus.* extras 由它生成）。
hyper-focus-api = { module = "com.xzakota.hyper.notification:focus-api", version.ref = "hyperFocusApi" }
mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "mp3spi" }
jflac-codec = { module = "org.jflac:jflac-codec", version.ref = "jflac" }
jlayer = { module = "javazoom:jlayer", version.ref = "jlayer" }
jmtc = { module = "io.github.selemba1000:JavaMediaTransportControls", version.ref = "jmtc" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
