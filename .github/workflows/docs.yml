name: Deploy docs to GitHub Pages

# 文档站构建与部署。源文档是 docs/ 下的 Markdown（唯一事实源），
# 站点由 VitePress 构建，产物在 docs/.vitepress/dist。
#
# 仓库需在 Settings → Pages → Source 选 "GitHub Actions" 才会生效。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-docs-links.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci --prefix docs

      # VitePress 构建，收尾时由 pagefind 生成全文搜索索引
      - name: Build site
        run: npm --prefix docs run build

      # VitePress 只校验页面是否存在；锚点由本脚本兜底
      - name: Validate links and anchors
        run: node scripts/check-docs-links.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
