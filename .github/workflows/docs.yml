name: Deploy docs to GitHub Pages

# 文档站构建与部署。源文档是 docs/ 下的 Markdown（唯一事实源），
# 每次 push 都由 scripts/build-docs-site.py 重新生成静态站点。
#
# 仓库需在 Settings → Pages → Source 选 "GitHub Actions" 才会生效。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs-site.py"
      - "scripts/check-docs-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 零第三方依赖，只用标准库；不需要 pip install
      - name: Build docs site
        run: python scripts/build-docs-site.py --out site --quiet

      - name: Validate links and anchors
        run: python scripts/check-docs-site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
