name: Debug Release

on:
  workflow_dispatch:
  push:
    tags:
      - "debug-v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  # 只负责 Android 产物。桌面产物（Windows MSI / Linux deb）由 desktop-release.yml 负责 ——
  # 它同样监听 debug-v* 与 v*，并在对应原生 runner 上构建。这与 release.yml（稳定版只出
  # Android APK）的分工保持一致。
  #
  # 历史坑（2026-09-25 修正）：本 job 曾在 ubuntu-latest 上跑 `:app:packageMsi`。
  # Compose Desktop 的 TargetFormat.Msi 绑定 OS.Windows，在 Linux 上该任务会被**注册但
  # disabled**（见 ConfigureJvmApplicationKt：isCompatibleWithCurrentOS() → setEnabled(false)）。
  # 后果是构建步骤看起来完全成功（任务 SKIPPED，BUILD SUCCESSFUL），随后
  # `cp .../msi/CPPlayer-<version>.msi` 因文件不存在而失败 —— 失败点出现在一个看起来
  # 无关的步骤上。同时该 MSI 与 desktop-release.yml 重复，故直接移除。
  debug-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37
        # material-kolor 5.x 的 android 产物要求 compileSdk ≥ 37（见 app-android 的
        # checkDebugAarMetadata 报错）。ubuntu-latest 预装的 SDK 不保证有 37，
        # 这里显式安装，缺了它构建必挂。
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#debug-v}"
          if [[ "$tag" == "$GITHUB_SHA" || -z "$version" ]]; then
            version="0.0.0-debug.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon -Papp.versionName=${{ steps.meta.outputs.version }} -Papp.versionCode=${{ steps.meta.outputs.code }} -Papp.releaseChannel=debug

      - name: Rename asset
        shell: bash
        run: |
          cp app-android/build/outputs/apk/debug/app-android-debug.apk "CPPlayer-${{ steps.meta.outputs.version }}-android-debug.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v${{ steps.meta.outputs.version }}
          name: CPPlayer ${{ steps.meta.outputs.version }} (debug)
          prerelease: true
          generate_release_notes: true
          files: CPPlayer-${{ steps.meta.outputs.version }}-android-debug.apk
