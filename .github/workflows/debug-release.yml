name: Debug Release

# 预发布：push `debug-v*` tag，或手动触发。
#
# 只负责 Android 产物。桌面产物（Windows MSI / Linux deb）由 desktop-release.yml 负责 ——
# 它同样监听 debug-v* 与 v*，并在对应原生 runner 上构建。这与 release.yml（稳定版只出
# Android APK）的分工保持一致。
#
# 历史坑（2026-09-25 修正）：本 job 曾在 ubuntu-latest 上跑 `:app:packageMsi`。
# Compose Desktop 的 TargetFormat.Msi 绑定 OS.Windows，在 Linux 上该任务会被**注册但
# disabled**（见 ConfigureJvmApplicationKt：isCompatibleWithCurrentOS() → setEnabled(false)）。
# 后果是构建步骤看起来完全成功（任务 SKIPPED，BUILD SUCCESSFUL），随后
# `cp .../msi/CPPlayer-<version>.msi` 因文件不存在而失败 —— 失败点出现在一个看起来
# 无关的步骤上。同时该 MSI 与 desktop-release.yml 重复，故直接移除。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（semver，例如 1.2.3）。留空则读 gradle.properties 的 app.versionName。"
        required: false
        default: ""
  push:
    tags:
      - "debug-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  debug-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37
        # material-kolor 5.x 的 android 产物要求 compileSdk ≥ 37（见 app-android 的
        # checkDebugAarMetadata 报错）。ubuntu-latest 预装的 SDK 不保证有 37，
        # 这里显式安装，缺了它构建必挂。
        # 注意：runner 上 sdkmanager 不在 PATH，必须走 $ANDROID_SDK_ROOT 全路径。
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#debug-v}"
          else
            # ⚠️ 手动触发时 GITHUB_REF_NAME 是**分支名**（main），不是 tag、更不是 sha。
            # 旧实现用 `[[ "$tag" == "$GITHUB_SHA" ]]` 判「非 tag 触发」—— 该条件恒为假，
            # 于是分支名被原样当成版本号，发布出 "CPPlayer main (debug)"。
            # 这里用 github.event.inputs（而不是 inputs）：本工作流同时挂了 push，
            # github.event.inputs 在非 dispatch 事件里稳定为空，不会影响 workflow 解析。
            version="${{ github.event.inputs.version }}"
            if [[ -z "$version" ]]; then
              version="$(grep -E '^app\.versionName=' gradle.properties | head -1 | cut -d= -f2- | tr -d '[:space:]')"
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' 不是合法的 semver 版本号（期望 X.Y.Z）。手动触发时请在 version 输入框里填一个。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=debug-v$version" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        # versionCode 由 Gradle 从 versionName 派生，这里不再传。
        run: ./gradlew :app-android:assembleDebug --no-daemon -Papp.versionName="${{ steps.meta.outputs.version }}" -Papp.releaseChannel=debug

      - name: Rename asset
        shell: bash
        run: |
          cp app-android/build/outputs/apk/debug/app-android-debug.apk "CPPlayer-${{ steps.meta.outputs.version }}-android-debug.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CPPlayer ${{ steps.meta.outputs.version }} (debug)
          prerelease: true
          generate_release_notes: true
          files: CPPlayer-${{ steps.meta.outputs.version }}-android-debug.apk
