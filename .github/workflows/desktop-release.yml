name: Desktop Release

# 桌面产物：Windows `.exe`（Velopack，由 jpackage 的 app-image 打）/ Linux `.deb`
# + 通用 `.tar.gz`，在各自原生 runner 上构建。
# stable 渠道还会把 tar.gz 发布到 AUR（cpplayer-bin）—— 配置步骤见 docs/dev/LINUX_PACKAGING.md。
# 与 release.yml（稳定版 Android） / debug-release.yml（预发布 Android）共用同一个
# GitHub Release —— 版本号与 tag 由下面的 `meta` job 统一解析，**不要**在 publish
# 里用 `github.ref_name` 现推：手动触发时它是分支名（main），会凭空建出 main 这个 tag。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（semver，例如 1.2.3）。留空则读 gradle.properties 的 app.versionName。"
        required: false
        default: ""
      channel:
        description: "发布渠道。debug 会发成 prerelease。"
        type: choice
        options:
          - debug
          - stable
        default: debug
  push:
    tags:
      - "debug-v*"
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  # JetBrains Runtime —— **打进产物**的运行时（jpackage 的 --runtime-image）。
  # 目的只有一个：让 WindowDraggableArea 走原生 WindowMove（贴边吸附 / 拖出还原 / 跟手）。
  # 方案与验收清单见 docs/dev/JBR_PACKAGING.md。
  #
  # ⚠️ 四点必须记住：
  #   1. 来源是 JetBrains 官方 cache-redirector，**不是 GitHub Releases** ——
  #      JetBrains/JetBrainsRuntime 的 release assets 全是 0（已扫过 3 页 100/页）。
  #   2. 官方**不提供** .sha256 文件，所以哈希由本仓库记录，且是**实际下载后算的**。
  #   3. 版本钉 21（不是 25）：desktop 的 jvmTarget 就是 JVM_21，
  #      「换厂商」与「升主版本」必须分开做。
  #   4. 取的是 **`jbrsdk-` 变体**（完整 JDK，含 jlink/jpackage/jmods），不是裸 `jbr-`：
  #      裸包是 JRE，Compose 的 checkRuntime 会报 "'jlink', 'jpackage' are missing"。
  #      打进产物的是 jlink 裁剪后的运行时，SDK 包不会让安装包变大。
  JBR_VERSION: "21.0.8"
  JBR_BUILD: "b1163.62"
  JBR_URL_BASE: "https://cache-redirector.jetbrains.com/intellij-jbr"

jobs:
  # 版本号 / tag / 渠道只在这里解析一次。
  # 放在独立 job 而不是 matrix job 的 outputs：matrix 各腿都会写同名 output，
  # 合并时取哪一腿是未定义的。
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 只需要读 gradle.properties 里 app.versionName 作兜底，不需要历史。
          fetch-depth: 1
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # ⚠️ 旧实现写的是 `if [[ "$tag" == "$GITHUB_SHA" ]]` —— GITHUB_REF_NAME
            # 永远不等于 SHA，该条件恒为假，于是手动触发时版本号 = 分支名。
            if [[ "${GITHUB_REF_NAME}" == debug-v* ]]; then
              channel="debug"
              version="${GITHUB_REF_NAME#debug-v}"
            else
              channel="stable"
              version="${GITHUB_REF_NAME#v}"
            fi
          else
            # 用 github.event.inputs（而不是 inputs）：本工作流同时挂了 push，
            # github.event.inputs 在非 dispatch 事件里稳定为空，不影响 workflow 解析。
            channel="${{ github.event.inputs.channel }}"
            version="${{ github.event.inputs.version }}"
            if [[ -z "$version" ]]; then
              version="$(grep -E '^app\.versionName=' gradle.properties | head -1 | cut -d= -f2- | tr -d '[:space:]')"
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' 不是合法的 semver 版本号（期望 X.Y.Z）。手动触发时请在 version 输入框里填一个。"
            exit 1
          fi
          tag_prefix=""
          if [[ "$channel" == "debug" ]]; then tag_prefix="debug-"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${tag_prefix}v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  desktop:
    needs: meta
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            # 空格分隔的多任务列表；Linux 腿同时打 deb 与通用 tar.gz。
            #
            # Windows **不再出 MSI**（jpackage 的 WiX 模板直出：升级不继承上次安装目录、
            # 目录选择框是老式对话框、向导步骤多，而 `--resource-dir` 不暴露 ⇒ 改不动）。
            # 改由 Velopack 从 jpackage 的 app-image 打：
            # `Setup.exe` + 更新源（`*.nupkg` / `RELEASES`）+ 便携 zip。
            gradleTasks: ":app:packageWindowsVelopack"
            assetPaths: |
              app/build/compose/binaries/main/velopack/*
            # Windows 侧 .zip / .tar.gz 都有，用 .zip。
            jbrExt: zip
            jbrSha: 432d0f9bdc687a6c8e2e13e22be83cdb0d9460b6b15752e84bd97165e13e9f5f
          - os: ubuntu-latest
            platform: linux
            gradleTasks: ":app:packageDeb :app:packageLinuxTarGz"
            assetPaths: |
              app/build/compose/binaries/main/deb/*
              app/build/compose/binaries/main/targz/*
            # ⚠️ Linux 侧 **只有 .tar.gz**：同名的 .zip 是 403。
            jbrExt: tar.gz
            jbrSha: 482b63da8ac63b8f108878d1bd8a23df15fd78cc9dfd23f3b824fbfe2512c81f
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        # 与两个 Android 工作流对齐：缓存命中 + 守护进程复用，否则桌面包每次全量冷启动。
        uses: gradle/actions/setup-gradle@v3

      # ⚠️ 仍然保留 setup-java：Gradle 守护进程 / Kotlin 编译 / 测试都跑在 temurin 上，
      # JBR 只是**被打进产物**的运行时。两者不是二选一，别顺手删掉上面那个 step。
      - name: Cache JBR
        id: jbr-cache
        uses: actions/cache@v4
        with:
          path: .jbr
          key: jbr-${{ env.JBR_VERSION }}-${{ matrix.platform }}-${{ matrix.jbrExt }}-${{ matrix.jbrSha }}

      - name: Fetch JBR (JetBrains Runtime)
        if: steps.jbr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .jbr
          # ⚠️ 必须用 `jbrsdk-` 前缀（完整 JDK，含 jlink / jpackage / jmods），
          # 不能用裸 `jbr-`（那是 JRE）—— Compose 的 checkRuntime 会在
          # javaHome 里找 jlink/jpackage，找不到直接失败：
          # "Failed to check JDK distribution: 'jlink', 'jpackage' are missing"。
          # 最终打进安装包的是 jlink 的裁剪产物，SDK 包不会让产物变大。
          file="jbrsdk-${JBR_VERSION}-${{ matrix.platform }}-x64-${JBR_BUILD}.${{ matrix.jbrExt }}"
          url="${JBR_URL_BASE}/${file}"
          # 先下临时文件、校验通过再落位 —— 中断留下的半截包若直接落位，
          # 下次会因目录存在被误判成已就绪，打出**损坏的运行时**。
          out=".jbr/${file}.part"
          echo "Fetching $url"
          curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$url"
          echo "${{ matrix.jbrSha }}  $out" | sha256sum -c - || { rm -f "$out"; exit 1; }

          # 解压 + **剥掉单层目录**：包内是 `jbr-<version>-<platform>-x64-<build>/` 一层，
          # 留着 javaHome 就指错一层（jpackage 只会报 invalid runtime image）。
          dest=".jbr/${{ matrix.platform }}-x64"
          mkdir -p "$dest"
          if [[ "${{ matrix.jbrExt }}" == "zip" ]]; then
            unzip -q "$out" -d .jbr/_unpack
          else
            mkdir -p .jbr/_unpack
            tar -xzf "$out" -C .jbr/_unpack
          fi
          inner="$(find .jbr/_unpack -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp -a "$inner/." "$dest/"
          rm -rf .jbr/_unpack "$out"
          # 兜底断言：javaHome 必须正好是含 `release` 的那层。
          test -f "$dest/release" || { echo "::error::JBR 解压布局不对，缺 $dest/release"; exit 1; }
          "$dest/bin/java" -version 2>&1 | head -3

      # Velopack 的 CLI 是 .NET global tool。装到工作区内的 `.tools/` 而不是默认的
      # `~/.dotnet/tools` —— 后者**不保证在 runner 的 PATH 上**，而 Gradle 侧只认
      # `-Pcp.vpkPath` 给的绝对路径（见 app/build.gradle.kts 的 packageWindowsVelopack）。
      # windows runner 自带 .NET SDK，不需要额外 setup-dotnet。
      - name: Install Velopack CLI (vpk)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path .tools vpk
          test -f .tools/vpk.exe || { echo "::error::vpk 没装成（.tools/vpk.exe 不存在）"; exit 1; }
          # ⚠️ **不能写 `vpk --version`**：vpk 用 Oakton 解析参数，没有 `--version` 这个
          # 选项，会报 "Required command was not provided. Unrecognized command or
          # argument '--version'" 并以非零退出 —— 这一步就把 job 弄红了。
          # `vpk pack -H` 打印扩展帮助（含全部参数与默认值），既能验证二进制可执行，
          # 也是核对命令行参数的唯一权威来源。
          .tools/vpk.exe pack -H | head -40

      - name: Build desktop package
        shell: bash
        # versionCode 由 Gradle 从 versionName 派生，不需要传；
        # releaseChannel 会经 jvmArgs 注入桌面 BuildInfo，供「关于」页与更新检查使用。
        #
        # -Pcp.jbrHome 让 app/build.gradle.kts 把 javaHome 指向刚下好的 JBR。
        # ⚠️ 没设这个属性时构建**不会失败**，只是静默用 temurin 打运行时 ——
        # 那种「看起来成功、其实没换」是最坏的结局，所以这里显式指定 + 上面有断言。
        run: |
          # ⚠️ **两个路径属性都必须用 Windows 风格的 `${{ github.workspace }}`**，
          # 不能写 `$PWD/...`：Git Bash 的 `$PWD` 是 `/d/a/...`，Java 在 Windows 上
          # **解析不了**这种路径 —— jbrHome 解析不了会静默回落到 temurin 打运行时
          # （构建照样"成功"，但 WindowDraggableArea 失去原生 WindowMove、贴边吸附全废），
          # vpkPath 解析不了则报「找不到 vpk」。GitHub 原生 runner 两种风格都接受，
          # 但混用是最隐蔽的坑：同一行里一个对一个错。
          ./gradlew ${{ matrix.gradleTasks }} --no-daemon \
            -Pcp.jbrHome="${{ github.workspace }}/.jbr/${{ matrix.platform }}-x64" \
            -Pcp.vpkPath="${{ github.workspace }}/.tools/vpk.exe" \
            -Papp.versionName="${{ needs.meta.outputs.version }}" \
            -Papp.releaseChannel="${{ needs.meta.outputs.channel }}"
      # tar.gz 的执行位全靠打包时原样保留，这里只做布局断言（缺关键文件立刻失败，
      # 别等到用户解压才发现）。执行位无法从 tar 列表读出，AUR 的 package() 里有
      # chmod 兜底（见 packaging/aur/cpplayer-bin/PKGBUILD）。
      - name: Verify tar.gz layout
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          f="$(ls app/build/compose/binaries/main/targz/CPPlayer-*-linux-x64.tar.gz)"
          echo "tar.gz: $f"
          # ⚠️ **不能**写成 `tar -tzf "$f" | grep -qx '...'`：`grep -q` 命中即退出、
          # 关掉管道读端，而内置 JBR 运行时的清单（几千条）远超 64 KiB 管道缓冲，此刻
          # tar 还在写 ⇒ 被 SIGPIPE 杀死（实测 `PIPESTATUS=141 0`；部分 tar 版本改报
          # `tar: stdout: write error` 后以 2 退出）。`set -o pipefail` 会把这个**假的**
          # 非零当成断言失败 —— 于是**文件在不在都红**，报的却是「缺启动器」，把排查
          # 方向全带偏（2026-10-05 首次发布就是这么挂的）。
          # 先把清单整个读进变量（tar 真正跑完、退出码可判；损坏包也会在此 `set -e` 中止），
          # 再对变量做 grep —— 断言该有的牙口一点没少。
          listing="$(tar -tzf "$f")"
          # ⚠️ 断言的路径必须是**实际存在的**。app-image 里**没有 `java` 可执行文件**：
          # jlink 带 `--strip-native-commands`，运行时镜像的 `bin/` 只剩 .so/.dll
          # （实测 Windows 镜像 `runtime/bin/` 里是 jli.dll / java.dll / server/，无 java.exe），
          # 启动器直接链 libjli，不靠 `bin/java`。曾在 `lib/runtime/bin/java` 上断言
          # ⇒ **永远红**，白挂两次发布（2026-10-05）。
          # 现在只断言「启动器 + 运行时镜像的结构性标记」，两者都是 jlink 必产：
          #   release      运行时镜像根，jlink 无条件写（含 JAVA_VERSION/IMPLEMENTOR）
          #   lib/modules  模块 jimage，真正的 Java 运行时数据
          # Linux app-image 布局（与 Windows 不同 —— Windows 启动器在根、运行时在 runtime/）：
          #   CPPlayer/bin/CPPlayer                    启动器
          #   CPPlayer/lib/app/*.jar + CPPlayer.cfg
          #   CPPlayer/lib/runtime/{release,lib/modules,lib/server/libjvm.so,...}
          for p in \
            'CPPlayer/bin/CPPlayer' \
            'CPPlayer/lib/runtime/release' \
            'CPPlayer/lib/runtime/lib/modules'
          do
            grep -qx "$p" <<<"$listing" || {
              echo "::error::tar.gz 里缺 $p"
              # 把实际内容打出来 —— 路径假设错了要能一眼看出来，别再靠猜。
              echo "--- 实际 CPPlayer/bin/ ---"
              grep '^CPPlayer/bin/' <<<"$listing" | head -20 || true
              echo "--- 实际 CPPlayer/lib/runtime/（前 30 条）---"
              grep '^CPPlayer/lib/runtime/' <<<"$listing" | head -30 || true
              exit 1
            }
          done
          # 运行时模块清单断言（2026-10-05）：`nativeDistributions.modules(...)` 里少一个模块
          # **本地永远看不出来** —— `desktopRun` 跑在完整的 JBR SDK 上，模块一个不缺；
          # 只有 jpackage 出的安装包才按这份清单裁剪。而它在用户机器上的表现是启动器只打一句
          # `Failed to launch JVM`：缺类若发生在**类初始化期**，栈里连模块名都不出现。
          # 1.4.3 就是这么死的 —— 缺 `jdk.unsupported` ⇒ `JbrWindowChrome.<clinit>` 抛
          # `NoClassDefFoundError: sun/misc/Unsafe` ⇒ `main()` 直接退出。
          # 真值在 jlink 写出的 `release` 里，直接读它，别去猜插件会带哪些模块
          # （`suggestModules` 只打日志、不参与打包，见 app/build.gradle.kts 的说明）。
          # ⚠️ 增删依赖后重跑 `./gradlew :app:suggestModules`，把输出同步进
          # app/build.gradle.kts 的 `nativeDistributions.modules(...)` 与下面这行。
          release="$(tar -xzf "$f" -O 'CPPlayer/lib/runtime/release')"
          modules="$(sed -n 's/^MODULES="\(.*\)"$/\1/p' <<<"$release" | tr ' ' '\n')"
          for m in jdk.unsupported java.instrument java.management jdk.security.auth
          do
            # ⚠️ 用 `grep -x` 精确整行比对，不用 `-w`：`-w` 会把 `java.management.rmi`
            # 里的 `java.management` 也算命中，真缺了反而放行。
            grep -qx "$m" <<<"$modules" || {
              echo "::error::运行时镜像缺模块 $m —— 见 app/build.gradle.kts 的 nativeDistributions.modules"
              echo "--- 实际 MODULES ---"
              grep '^MODULES=' <<<"$release" || true
              exit 1
            }
          done
          echo "tar.gz 布局 OK"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CPPlayer-${{ needs.meta.outputs.version }}-${{ matrix.platform }}
          path: ${{ matrix.assetPaths }}
      # jpackage 失败时只给 exit code，真正原因在 compose 日志里。
      # 直接 cat 到 job 日志 + 传 artifact，下次失败不用再猜。
      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          ls -R app/build/compose/logs || true
          for f in app/build/compose/logs/*/*-err.txt app/build/compose/logs/*/*-out.txt; do
            echo "===== $f ====="
            cat "$f" || true
          done
      - name: Upload jpackage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CPPlayer-${{ needs.meta.outputs.version }}-${{ matrix.platform }}-logs
          path: app/build/compose/logs/**/*
          if-no-files-found: ignore

  publish:
    needs: [meta, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CPPlayer-*
          merge-multiple: true
      - name: Publish desktop assets
        uses: softprops/action-gh-release@v2
        with:
          # 用 meta 解析出来的 tag，不用 github.ref_name（手动触发时那是分支名）。
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "CPPlayer ${{ needs.meta.outputs.version }}${{ needs.meta.outputs.channel == 'debug' && ' (debug)' || '' }}"
          prerelease: ${{ needs.meta.outputs.channel != 'stable' }}
          files: release-assets/**/*

  # ---------------------------------------------------------------------------
  # AUR 自动发布（cpplayer-bin）：仅 stable 渠道。
  #
  # 为什么跑在 archlinux:base-devel 容器里：更新 .SRCINFO 需要 makepkg
  # （--printsrcinfo），ubuntu runner 上没有 pacman/makepkg，Arch 官方镜像开箱即有。
  # 需要 secret：AUR_SSH_PRIVATE_KEY（配套公钥填在 AUR 账号 My Account 里），
  # 配置步骤见 docs/dev/LINUX_PACKAGING.md；未配置时本 job 打 notice 后直接跳过，
  # 不影响 release 本身。
  # ---------------------------------------------------------------------------
  aur:
    needs: [meta, publish]
    if: needs.meta.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      AUR_PACKAGE: cpplayer-bin
    steps:
      # checkout 依赖 git，所以 pacman 必须在 checkout 之前。
      - name: Install git / openssh / curl
        run: pacman -Syu --noconfirm git openssh curl
      - uses: actions/checkout@v4

      - name: Check AUR key configured
        id: guard
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY 未配置 —— 跳过 AUR 发布（配置步骤见 docs/dev/LINUX_PACKAGING.md）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH key for AUR
        if: steps.guard.outputs.skip != 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # ⚠️ 全程用 "$HOME" 绝对路径，**不要写 `~`**。
          # 容器 job 里 runner 把 HOME 覆盖成 /github/home（actions/runner#863、#1146），
          # 而 ssh 展开 `~` 走的是 passwd 库（root ⇒ /root），**不认 $HOME**
          # （本机实测：HOME 指到临时目录，ssh 仍去读真实用户目录）。
          # 两者不一致 ⇒ ssh-keyscan 把 host key 写进 $HOME/.ssh/known_hosts，
          # ssh 却去读空的 /root/.ssh/known_hosts ⇒ `Host key verification failed.`
          # —— 2026-10-05 v1.4.3 首次跑这个 job 就是这么挂的（之前一直被 tar.gz
          # 断言挡在前面，这个 job 从没真正跑过）。
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"

          # AUR 的 host key 取回后直接落盘。**不写 ~/.ssh/config** —— User 由 URL 里的
          # `aur@` 给出，identity 与 known_hosts 在下面用 GIT_SSH_COMMAND 显式指定，
          # ssh 因此完全不需要解析 `~`，HOME 被怎么覆盖都不影响。
          ssh-keyscan -t rsa,ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts" \
            || { echo "::error::ssh-keyscan 没拿到 aur.archlinux.org 的 host key"; exit 1; }
          echo "AUR host key 指纹（可与 Arch Wiki 公布的值核对）："
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

          {
            echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          } >> "$GITHUB_ENV"

      # 先探一次连接，把失败原因分开 —— git 只会甩一句
      # "Could not read from remote repository"，看不出是 host key 不认（代码问题）
      # 还是 key 没在 AUR 注册（配置问题，只能人去 aur.archlinux.org 补）。
      - name: Probe AUR connection
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          probe="$(mktemp)"
          # 必须用**与 git 完全相同**的那组 ssh 选项去探（GIT_SSH_COMMAND 是上一步写进
          # GITHUB_ENV 的）—— 直接写裸 `ssh` 会退回 ssh 自己的 `~` 解析，走的是另一条
          # 路径，等于没探（本步骤第一版就是这么写的，探针会自己先红）。
          # ⚠️ $GIT_SSH_COMMAND 是「命令 + 参数」的整串，**不能加引号**展开。
          # shellcheck disable=SC2086
          $GIT_SSH_COMMAND -o BatchMode=yes -o ConnectTimeout=20 -T aur@aur.archlinux.org >"$probe" 2>&1 || true
          cat "$probe"
          if grep -q 'Host key verification failed' "$probe"; then
            echo "::error::AUR host key 校验失败 —— known_hosts 没被 ssh 读到"; exit 1
          fi
          if grep -q 'Permission denied' "$probe"; then
            echo "::error::AUR 拒绝了这把 key：公钥还没填进 AUR 账号的 SSH Public Key（步骤见 docs/dev/LINUX_PACKAGING.md §3.1）"; exit 1
          fi
          echo "AUR 连接自检通过"

      - name: Hash release asset
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # publish job 已完成（needs 链），资产已存在；流式计算哈希不落盘。
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CPPlayer-${VERSION}-linux-x64.tar.gz"
          SHA256="$(curl -fsSL "$ASSET_URL" | sha256sum | cut -d' ' -f1)"
          # AUR 的 pkgver 只允许 [A-Za-z0-9._]：剥掉预发布后缀（-beta.1 / +build.7）。
          # 稳定 tag（vX.Y.Z）下两者本来就相等。
          PKGVER="$(printf '%s' "$VERSION" | sed -E 's/[-+].*//')"
          {
            echo "asset_url=${ASSET_URL}"
            echo "sha256=${SHA256}"
            echo "pkgver=${PKGVER}"
          } >> "$GITHUB_ENV"

      - name: Update AUR package
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # AUR 允许 clone 尚不存在的包名（得到空仓库）—— 首次发布也是全自动的。
          # ⚠️ AUR 只接受 master 分支（Arch Wiki），统一显式 push HEAD:master。
          git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" aur
          cp packaging/aur/cpplayer-bin/PKGBUILD aur/PKGBUILD
          cd aur
          # 只重写五行元数据；PKGBUILD 其余内容以本仓库模板为准原样带上去。
          sed -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s#^url=.*#url=\"https://github.com/${GITHUB_REPOSITORY}\"#" \
            -e "s#^source=.*#source=(\"CPPlayer-\${pkgver}-linux-x64.tar.gz::${asset_url}\")#" \
            -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
            PKGBUILD
          makepkg --printsrcinfo > .SRCINFO
          # AUR 提交以这里的身份落库（Arch Wiki 建议按包配置，别动容器全局）。
          git config user.name  "CPPlayer Release Bot"
          git config user.email "cpplayer-bot@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::AUR 元数据无变化，跳过 push"
          else
            git commit -m "Update to ${pkgver}"
            git push origin HEAD:master
          fi
