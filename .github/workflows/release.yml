name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon -Papp.versionName=${GITHUB_REF_NAME#v} -Papp.versionCode=${GITHUB_RUN_NUMBER} -Papp.releaseChannel=stable
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
