name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37
        # 与 debug-release.yml 同理：material-kolor 5.x 要求 compileSdk ≥ 37，
        # runner 预装 SDK 不保证有 37，显式安装否则 checkReleaseAarMetadata 必挂。
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode Keystore
        # fork 构建或 secret 未配时跳过：否则会落下一个 0 字节的 release.jks，
        # app-android 的签名守卫看到「文件存在」就会尝试用它签名，
        # 报出来的会是难以定位的 keystore 损坏错，而不是「未签名」。
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          test -s keystore/release.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app-android:assembleRelease --no-daemon \
            -Papp.versionName=${GITHUB_REF_NAME#v} \
            -Papp.versionCode=${GITHUB_RUN_NUMBER} \
            -Papp.releaseChannel=stable

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app-android/build/outputs/apk/release/app-android-release.apk