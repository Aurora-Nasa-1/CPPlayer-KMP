name: Release

# 稳定版：push `v*` tag。
# 本工作流只出 **Android release APK**；桌面的 Windows MSI / Linux deb 由
# desktop-release.yml 在同一个 tag 上并行构建，并附加到**同一个** GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 与 desktop-release.yml 的 publish job 争用同一个 GitHub Release，串行化。
# ⚠️ 这是 best effort：GitHub 的 concurrency 组是**仓库级**的，两个工作流用同一个
# 组名确实会排队，但不要把正确性押在它上面 —— softprops/action-gh-release 本身
# 对「release 已存在」是幂等的（存在则更新），这才是真正的兜底。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37
        # 与 debug-release.yml 同理：material-kolor 5.x 要求 compileSdk ≥ 37，
        # runner 预装 SDK 不保证有 37，显式安装否则 checkReleaseAarMetadata 必挂。
        # 注意：runner 上 sdkmanager 不在 PATH，必须走 $ANDROID_SDK_ROOT 全路径。
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # 稳定工作流只由 tag 触发，GITHUB_REF_NAME 就是 tag 本身（v1.2.3）。
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' 不是合法的 vX.Y.Z —— 版本号解析失败"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        # ⚠️ 守卫**必须**写在脚本里，不能写成 `if: ${{ secrets.X != '' }}`：
        # `secrets` 上下文在 `if` 里不可用，GitHub 会在解析阶段直接判这个 workflow
        # 非法（Unrecognized named-value: 'secrets'），整个 workflow 一个 job 都跑不起来。
        # 稳定版必须有签名材料；缺失时明确失败，绝不把未签名 APK 作为正式更新发布。
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::All Android release signing secrets are required to publish a stable APK."
            exit 1
          fi
          mkdir -p keystore
          # 用 printf 而不是 echo：secret 里若含反斜杠/前导 -，echo 会改写内容。
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          test -s keystore/release.jks

      - name: Build release APK
        # 只传 versionName / releaseChannel —— **versionCode 由 Gradle 从 versionName
        # 派生**（根 build.gradle.kts）。以前这里传 GITHUB_RUN_NUMBER，与 tag 无关，
        # 同一个 tag 重跑一次就换一个码，且和 scripts/release.ps1 算出来的对不上。
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          ./gradlew :app-android:assembleRelease --no-daemon \
            -Papp.versionName="${{ steps.meta.outputs.version }}" \
            -Papp.releaseChannel=stable

      - name: Upload Android R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: CPPlayer-${{ steps.meta.outputs.version }}-android-mapping
          path: app-android/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Rename asset
        # 与 debug 资产（CPPlayer-<version>-android-debug.apk）保持同一套命名。
        # 应用内更新只按扩展名挑资产，改名不影响它。
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app-android/build/outputs/apk/release"
          signed_apk="$apk_dir/app-android-release.apk"
          if [[ ! -s "$signed_apk" ]]; then
            echo "::error::Signed release APK was not produced; refusing to publish an unsigned artifact."
            exit 1
          fi
          cp "$signed_apk" "CPPlayer-${{ steps.meta.outputs.version }}-android.apk"

      - name: Generate release notes
        shell: bash
        run: |
          bash scripts/generate_release_notes.sh "${{ steps.meta.outputs.tag }}" "${{ runner.temp }}/RELEASE_NOTES.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CPPlayer ${{ steps.meta.outputs.version }}
          prerelease: false
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: CPPlayer-${{ steps.meta.outputs.version }}-android.apk

      - name: Check for Sentry auth token
        id: sentry-auth
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry release
        if: ${{ steps.sentry-auth.outputs.available == 'true' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aurora-9i
          SENTRY_PROJECT: cpplayer-kmp
          SENTRY_URL: https://de.sentry.io/
        with:
          version: cp.player@${{ steps.meta.outputs.version }}
          environment: production
