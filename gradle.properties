# 堆 2G（2026-11-14 由 4G 下调，控制常驻内存；本机 16G / GitHub runner 7G）。
# ⚠️ 历史：assembleRelease 的 minifyReleaseWithR8 + lintVitalAnalyzeRelease 在 1G 下
# 冷构建必 OOM（2026-10-04 实锤）→ 当时升到 4G。若 release 冷构建再报
# "running out of JVM heap space"，优先单独给该任务调大 -Xmx，别误判成代码错。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapBaseMinAddress=2G -Dfile.encoding=UTF-8

# Kotlin 编译守护进程单独限额（改前实测继承到 4G）。
# ⚠️ 实测 KGP 2.4.21 默认走 Build Tools API（kotlin.compiler.runViaBuildToolsApi=true）时，
# 本项不生效：新拉起的 daemon 仍是 -Xmx4096m。要强制生效需再加
# kotlin.compiler.runViaBuildToolsApi=false（会切回旧的 Gradle compiler runner）。
# 若编译报 OOM / "Could not connect to kotlin daemon"，先把它调到 1536m~2048m。
kotlin.daemon.jvmargs=-Xmx1024m

# 并行 worker 限 4（本机 12 逻辑核；再高会和并行 AI 会话抢内存/IO）。
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Single source of truth for Android/Desktop artifacts and GitHub releases.
# CI 只覆盖 app.versionName / app.releaseChannel 两项。
#
# ⚠️ 这里**故意没有** app.versionCode：它由 app.versionName 在根
# build.gradle.kts 里派生（major*1_000_000 + minor*1_000 + patch）。
# 写死一个数字会让「同一个版本号在不同路径上得到不同的 versionCode」重新出现，
# 而那正是安装被判成降级 / 正式版升不过 debug 包的根因。
# 只有本地 fastrelease 包需要显式覆盖，用命令行 `-Papp.versionCode=` 传，不要写进这里。
app.versionName=1.8.9
app.releaseChannel=stable
