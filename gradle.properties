# 堆 4G（2026-11-15 由 2G 调回：修 :app:compileKotlinDesktop 的
# "java.lang.OutOfMemoryError: GC overhead limit exceeded"，并恢复 R8 冷构建的历史余量）。
# 注意：Kotlin 编译 OOM 的直接原因在下面的 kotlin.daemon.jvmargs（编译器跑在
# Kotlin daemon 里，不是 Gradle daemon）；要省内存先降本项，别动那一项。
# ⚠️ 历史：assembleRelease 的 minifyReleaseWithR8 + lintVitalAnalyzeRelease 在 1G 下
# 冷构建必 OOM（2026-10-04 实锤）→ 当时升到 4G。若 release 冷构建再报
# "running out of JVM heap space"，优先单独给该任务调大 -Xmx，别误判成代码错。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapBaseMinAddress=2G -Dfile.encoding=UTF-8

# Kotlin 编译守护进程单独限额。
# 2026-11-15 实测：KGP 2.4.21 走 Build Tools API（kotlin.compiler.runViaBuildToolsApi=true）
# 时本项**确实生效**——`KotlinCompileDaemon` 进程命令行就是这里的 `-Xmx3072m
# -XX:MaxMetaspaceSize=768m`（旧注释说"不生效 / 继承 4G"已被证伪，别再据此调
# org.gradle.jvmargs）。
# 2G 下 :app:compileKotlinDesktop 会 `java.lang.OutOfMemoryError: GC overhead limit exceeded`
# ⇒ 调到 3G；仍 OOM 时再升到 4096m。
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

# 并行 worker 限 4（本机 12 逻辑核；再高会和并行 AI 会话抢内存/IO）。
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Single source of truth for Android/Desktop artifacts and GitHub releases.
# CI 只覆盖 app.versionName / app.releaseChannel 两项。
#
# ⚠️ 这里**故意没有** app.versionCode：它由 app.versionName 在根
# build.gradle.kts 里派生（major*1_000_000 + minor*1_000 + patch）。
# 写死一个数字会让「同一个版本号在不同路径上得到不同的 versionCode」重新出现，
# 而那正是安装被判成降级 / 正式版升不过 debug 包的根因。
# 只有本地 fastrelease 包需要显式覆盖，用命令行 `-Papp.versionCode=` 传，不要写进这里。
app.versionName=1.9.2
app.releaseChannel=stable
